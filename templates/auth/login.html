{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Log in</h1>
  <form method="post">
    <label>Username
      <input name="username" value="{{ request.form.username }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="button">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</section>
{% endblock %}
