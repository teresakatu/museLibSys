{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Create your account</h1>
  <form method="post">
    <label>Username
      <input name="username" value="{{ request.form.username }}" maxlength="50" required autofocus>
    </label>
    <label>Email
      <input type="email" name="email" value="{{ request.form.email }}" maxlength="255" required>
    </label>
    <label>Password
      <input type="password" name="password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" minlength="8" required>
    </label>
    <button type="submit" class="button">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
